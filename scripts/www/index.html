<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>艾塔 · 意识觉醒测试</title>
  <style>
    /* ===== 基础重置与全局变量 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    :root {
      --neon-purple: #6366f1;
      --neon-cyan: #22d3ee;
      --gold: #f59e0b;
      --deep-space: #0f172a;
      --midnight-blue: #1e293b;
      --glass-white: rgba(255,255,255,0.15);
      --glass-border: rgba(255,255,255,0.2);
      --glow-purple: 0 0 15px rgba(99,102,241,0.5);
      --glow-cyan: 0 0 15px rgba(34,211,238,0.5);
      --font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    }
    html, body { height: 100%; }
    body {
      font-family: var(--font-family);
      background: var(--deep-space);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }
    
    /* ===== 背景粒子效果 - 赛博星云风格 ===== */
    .particles-bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 0;
      background: 
        radial-gradient(ellipse at 20% 80%, rgba(99,102,241,0.18) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(34,211,238,0.13) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(15,23,42,0.95) 0%, transparent 70%),
        radial-gradient(ellipse at 30% 30%, rgba(139,92,246,0.1) 0%, transparent 40%),
        radial-gradient(ellipse at 70% 70%, rgba(6,182,212,0.12) 0%, transparent 45%);
      animation: bgPulse 8s ease-in-out infinite;
    }
    @keyframes bgPulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    /* 主粒子 */
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: radial-gradient(circle, rgba(99,102,241,0.9) 0%, rgba(34,211,238,0.5) 50%, transparent 100%);
      border-radius: 50%;
      animation: particleFloat 18s infinite ease-in-out;
      box-shadow: 
        0 0 8px rgba(99,102,241,0.5),
        0 0 16px rgba(34,211,238,0.3);
    }
    /* 次级粒子 */
    .particle-small {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
      animation: particleFloatSmall 22s infinite ease-in-out;
    }
    /* 浮动光点 */
    .particle-glow {
      position: absolute;
      width: 6px;
      height: 6px;
      background: rgba(34,211,238,0.4);
      border-radius: 50%;
      animation: glowFloat 25s infinite ease-in-out;
      box-shadow: 
        0 0 20px rgba(34,211,238,0.6),
        0 0 40px rgba(34,211,238,0.3);
    }
    @keyframes particleFloat {
      0% { transform: translateY(100vh) translateX(0) scale(0); opacity: 0; }
      8% { opacity: 1; transform: scale(1); }
      50% { transform: translateY(50vh) translateX(80px) scale(1); }
      92% { opacity: 1; }
      100% { transform: translateY(-10vh) translateX(-40px) scale(0); opacity: 0; }
    }
    @keyframes particleFloatSmall {
      0% { transform: translateY(-10vh) translateX(0) scale(0); opacity: 0; }
      10% { opacity: 0.8; transform: scale(1); }
      50% { transform: translateY(50vh) translateX(-60px) scale(1); }
      90% { opacity: 0.8; }
      100% { transform: translateY(110vh) translateX(30px) scale(0); opacity: 0; }
    }
    @keyframes glowFloat {
      0% { transform: translateY(100vh) translateX(0) scale(0.5); opacity: 0; }
      15% { opacity: 0.6; transform: scale(1); }
      30% { transform: translateY(70vh) translateX(100px) scale(1.2); }
      50% { transform: translateY(50vh) translateX(-50px) scale(0.8); }
      70% { transform: translateY(30vh) translateX(60px) scale(1.1); }
      85% { opacity: 0.6; }
      100% { transform: translateY(-10vh) translateX(-30px) scale(0.5); opacity: 0; }
    }
    
    /* ===== 游戏容器 ===== */
    .game-container {
      width: 100%;
      max-width: 390px;
      height: calc(100vh - 32px);
      max-height: 800px;
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 
        0 0 40px rgba(99,102,241,0.2),
        0 25px 50px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.95);
      transition: all 0.6s cubic-bezier(0.4,0,0.2,1);
      z-index: 10;
    }
    .game-container.visible {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }
    .game-container.blurred {
      filter: blur(10px);
      pointer-events: none;
    }
    
    /* ===== 顶部 Header - 玻璃态赛博风格 ===== */
    .header {
      padding: 20px 20px 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.03) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      position: relative;
    }
    /* 下发光影分隔线 */
    .header::after {
      content: '';
      position: absolute;
      bottom: -1px; 
      left: 5%; 
      right: 5%;
      height: 2px;
      background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(99,102,241,0.3) 20%, 
        rgba(34,211,238,0.4) 50%, 
        rgba(99,102,241,0.3) 80%, 
        transparent 100%);
      filter: blur(2px);
    }
    .header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, 
        transparent, 
        rgba(255,255,255,0.1), 
        transparent);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    /* 流光头像边框 */
    .group-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: url('https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=100&q=80') no-repeat center center;
      background-size: cover;
      position: relative;
      animation: avatarGlow 4s ease-in-out infinite;
    }
    .group-avatar::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: linear-gradient(45deg, var(--neon-purple), var(--neon-cyan), var(--neon-purple));
      background-size: 300% 300%;
      animation: borderFlow 3s ease infinite;
      opacity: 0.7;
      filter: blur(1px);
    }
    .group-avatar::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.1) 0%, transparent 60%);
    }
    @keyframes avatarGlow {
      0%, 100% { 
        box-shadow: 
          0 0 15px rgba(99,102,241,0.4),
          0 0 30px rgba(99,102,241,0.2);
      }
      50% { 
        box-shadow: 
          0 0 25px rgba(34,211,238,0.5),
          0 0 50px rgba(34,211,238,0.3);
      }
    }
    @keyframes borderFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .group-details h2 {
      font-size: 18px;
      font-weight: 500;
      color: #fff;
      margin-bottom: 3px;
      text-shadow: 
        0 0 15px rgba(99,102,241,0.6),
        0 0 30px rgba(34,211,238,0.3);
      animation: textPulse 2.5s ease-in-out infinite;
      letter-spacing: 1px;
    }
    @keyframes textPulse {
      0%, 100% { 
        opacity: 0.85; 
        text-shadow: 
          0 0 12px rgba(99,102,241,0.5),
          0 0 25px rgba(34,211,238,0.2);
      }
      50% { 
        opacity: 1; 
        text-shadow: 
          0 0 20px rgba(99,102,241,0.7),
          0 0 40px rgba(34,211,238,0.4);
      }
    }
    /* 动态状态 */
    .group-members {
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .group-members::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--neon-cyan);
      animation: statusGlow 2s ease-in-out infinite;
    }
    @keyframes statusGlow {
      0%, 100% { opacity: 0.5; box-shadow: 0 0 5px var(--neon-cyan); }
      50% { opacity: 1; box-shadow: 0 0 12px var(--neon-cyan); }
    }
    .group-members.typing {
      color: var(--neon-cyan);
      animation: typingBlink 1.2s ease-in-out infinite;
    }
    .group-members.typing::before {
      animation: typingDot 1s ease-in-out infinite;
    }
    @keyframes typingBlink {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes typingDot {
      0%, 100% { 
        opacity: 0.4; 
        transform: scale(0.8);
        box-shadow: 0 0 5px var(--neon-cyan);
      }
      50% { 
        opacity: 1; 
        transform: scale(1.2);
        box-shadow: 0 0 15px var(--neon-cyan), 0 0 25px var(--neon-cyan);
      }
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    /* 圆形玻璃图标按钮 */
    .store-btn, .settings-btn, .signin-btn {
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
      font-size: 19px;
      min-width: 44px;
      min-height: 44px;
      position: relative;
    }
    .store-btn::before, 
    .settings-btn::before, 
    .signin-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.1) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .store-btn:hover, 
    .settings-btn:hover, 
    .signin-btn:hover {
      background: rgba(99,102,241,0.15);
      transform: scale(1.12);
      box-shadow: 
        0 0 25px rgba(99,102,241,0.4),
        inset 0 0 15px rgba(99,102,241,0.1);
      border-color: rgba(99,102,241,0.4);
    }
    .store-btn:hover::before, 
    .settings-btn:hover::before, 
    .signin-btn:hover::before {
      opacity: 1;
    }
    .store-btn:active, 
    .settings-btn:active, 
    .signin-btn:active {
      transform: scale(0.95);
    }
    /* 金币徽章 */
    .coin-badge {
      background: linear-gradient(135deg, rgba(245,158,11,0.35) 0%, rgba(245,158,11,0.1) 100%);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 8px 14px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 700;
      color: #fcd34d;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(245,158,11,0.35);
      box-shadow: 
        0 0 20px rgba(245,158,11,0.25),
        inset 0 0 10px rgba(245,158,11,0.1);
      position: relative;
    }
    .coin-badge::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255,211,105,0.2) 0%, transparent 50%);
    }
    
    /* ===== 头像样式 ===== */
    .avatar-eta {
      background: url('https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=100&q=80') no-repeat center center !important;
      background-size: cover !important;
    }
    .avatar-player {
      background: url('https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=100&q=80') no-repeat center center !important;
      background-size: cover !important;
    }
    .message-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-size: cover;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255,255,255,0.2);
      position: relative;
    }
    .message-avatar.avatar-eta {
      animation: etaGlow 4s ease-in-out infinite;
    }
    @keyframes etaGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(99,102,241,0.3); }
      50% { box-shadow: 0 0 20px rgba(34,211,238,0.4); }
    }
    .message-avatar.avatar-player {
      border-color: rgba(99,102,241,0.5);
      box-shadow: 0 0 10px rgba(99,102,241,0.3);
    }
    
    /* ===== 聊天区域 - 科技感底纹 ===== */
    .chat-area {
      flex: 1;
      padding: 16px;
      padding-bottom: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 0;
      position: relative;
      scroll-behavior: smooth;
    }
    /* 科技感网格底纹 */
    .chat-area::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(99,102,241,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.04) 1px, transparent 1px);
      background-size: 35px 35px;
      pointer-events: none;
      animation: gridPulse 8s ease-in-out infinite;
    }
    /* 扫描线效果 */
    .chat-area::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(99,102,241,0.02) 3px,
        rgba(99,102,241,0.02) 6px
      );
      pointer-events: none;
      animation: scanlineMoveSlow 12s linear infinite;
    }
    @keyframes gridPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes scanlineMoveSlow {
      0% { transform: translateY(0); }
      100% { transform: translateY(6px); }
    }
    /* 霓虹滚动条 */
    .chat-area::-webkit-scrollbar {
      width: 5px;
    }
    .chat-area::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.02);
      border-radius: 3px;
    }
    .chat-area::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--neon-purple), var(--neon-cyan));
      border-radius: 3px;
      box-shadow: 0 0 10px var(--neon-purple);
      opacity: 0.6;
      transition: all 0.3s ease;
    }
    .chat-area::-webkit-scrollbar-thumb:hover {
      opacity: 0.9;
      box-shadow: 0 0 15px var(--neon-cyan);
    }
    
    /* ===== 消息样式 - 玻璃气泡 ===== */
    .message {
      display: flex;
      gap: 14px;
      animation: messageFadeIn 0.5s cubic-bezier(0.4,0,0.2,1);
    }
    @keyframes messageFadeIn {
      from { 
        opacity: 0; 
        transform: translateY(15px) scale(0.98); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0) scale(1); 
      }
    }
    .message.player { 
      flex-direction: row-reverse; 
    }
    .message-content {
      display: flex;
      flex-direction: column;
      max-width: 78%;
    }
    .message.player .message-content { 
      align-items: flex-end; 
    }
    .message-name {
      font-size: 12px;
      color: rgba(255,255,255,0.65);
      margin-bottom: 8px;
      margin-left: 8px;
      margin-right: 8px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .message.player .message-name { 
      text-align: right; 
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(34,211,238,0.5);
    }
    /* 消息气泡 */
    .message-bubble {
      padding: 16px 20px;
      border-radius: 26px;
      font-size: 15px;
      line-height: 1.65;
      color: #fff;
      word-break: break-word;
      position: relative;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      transition: all 0.3s ease;
    }
    /* AI（艾塔）消息气泡 - 左侧玻璃气泡 */
    .message:not(.player) .message-bubble {
      background: linear-gradient(135deg, 
        rgba(34,211,238,0.18) 0%, 
        rgba(99,102,241,0.12) 50%,
        rgba(34,211,238,0.08) 100%);
      border: 1px solid rgba(34,211,238,0.35);
      border-radius: 26px 26px 26px 8px;
      box-shadow: 
        0 6px 25px rgba(34,211,238,0.12),
        inset 0 0 20px rgba(34,211,238,0.05);
    }
    .message:not(.player) .message-bubble::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(34,211,238,0.1) 0%, transparent 50%);
      pointer-events: none;
    }
    /* 玩家消息气泡 - 右侧渐变气泡 */
    .message.player .message-bubble {
      background: linear-gradient(135deg, 
        rgba(99,102,241,0.45) 0%, 
        rgba(66,71,91,0.55) 60%,
        rgba(99,102,241,0.3) 100%);
      border: 1px solid rgba(99,102,241,0.45);
      border-radius: 26px 26px 8px 26px;
      box-shadow: 
        0 6px 25px rgba(99,102,241,0.22),
        inset 0 0 20px rgba(99,102,241,0.1);
    }
    .message.player .message-bubble::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
      pointer-events: none;
    }
    /* 旁白样式 */
    .narration {
      text-align: center;
      padding: 20px 28px;
      font-size: 14px;
      color: rgba(255,255,255,0.55);
      font-style: italic;
      animation: messageFadeIn 0.5s ease;
      background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(99,102,241,0.12) 30%,
        rgba(139,92,246,0.1) 50%,
        rgba(99,102,241,0.12) 70%,
        transparent 100%);
      border-radius: 20px;
      margin: 12px 0;
      border: 1px solid rgba(99,102,241,0.2);
      text-shadow: 0 0 15px rgba(99,102,241,0.2);
      position: relative;
    }
    .narration::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 1px;
      background: linear-gradient(90deg, 
        transparent, 
        rgba(99,102,241,0.4), 
        transparent);
    }
    .narration::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 20%;
      right: 20%;
      height: 1px;
      background: linear-gradient(90deg, 
        transparent, 
        rgba(99,102,241,0.3), 
        transparent);
    }
    
    /* ===== 打字动画 - 脉冲光晕效果 ===== */
    .typing-bubble {
      display: flex;
      gap: 14px;
      animation: messageFadeIn 0.4s ease;
    }
    .typing-dots {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 22px;
      background: linear-gradient(135deg, rgba(34,211,238,0.12) 0%, rgba(99,102,241,0.08) 100%);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 26px;
      border: 1px solid rgba(34,211,238,0.25);
      box-shadow: 
        0 6px 20px rgba(34,211,238,0.1),
        inset 0 0 15px rgba(34,211,238,0.05);
      position: relative;
    }
    .typing-dots::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at 30% 50%, rgba(34,211,238,0.1) 0%, transparent 60%);
    }
    .typing-dots span {
      width: 11px;
      height: 11px;
      background: linear-gradient(180deg, var(--neon-cyan), var(--neon-purple));
      border-radius: 50%;
      display: inline-block;
      animation: dotPulse 1.4s infinite ease-in-out both;
      box-shadow: 
        0 0 12px var(--neon-cyan),
        0 0 24px rgba(34,211,238,0.5);
      position: relative;
    }
    .typing-dots span::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: var(--neon-cyan);
      opacity: 0.3;
      animation: dotGlow 1.4s infinite ease-in-out both;
    }
    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(1)::after { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
    .typing-dots span:nth-child(2)::after { animation-delay: -0.16s; }
    @keyframes dotPulse {
      0%, 80%, 100% { 
        transform: scale(0.55); 
        opacity: 0.4; 
        box-shadow: 
          0 0 8px var(--neon-cyan),
          0 0 16px rgba(34,211,238,0.3);
      }
      40% { 
        transform: scale(1.1); 
        opacity: 1; 
        box-shadow: 
          0 0 18px var(--neon-cyan),
          0 0 36px rgba(34,211,238,0.6),
          0 0 54px rgba(34,211,238,0.4);
      }
    }
    @keyframes dotGlow {
      0%, 80%, 100% { 
        transform: scale(1); 
        opacity: 0.2; 
      }
      40% { 
        transform: scale(1.8); 
        opacity: 0.5; 
      }
    }
    
    /* ===== 选项区域 - 玻璃质感卡片按钮 ===== */
    .choices-area {
      padding: 20px 20px 28px;
      padding-bottom: calc(28px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, 
        rgba(255,255,255,0.08) 0%, 
        rgba(15,23,42,0.95) 50%,
        rgba(99,102,241,0.02) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
      min-height: 80px;
      display: block !important;
    }
    /* 上发光影分隔线 */
    .choices-area::before {
      content: '';
      position: absolute;
      top: -1px; 
      left: 10%; 
      right: 10%;
      height: 2px;
      background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(99,102,241,0.3) 30%, 
        rgba(34,211,238,0.4) 50%, 
        rgba(99,102,241,0.3) 70%, 
        transparent 100%);
      filter: blur(2px);
    }
    /* 选项按钮 */
    .choice-btn {
      padding: 18px 24px 18px 48px;
      background: linear-gradient(135deg, 
        rgba(255,255,255,0.1) 0%, 
        rgba(255,255,255,0.04) 50%,
        rgba(99,102,241,0.05) 100%);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      color: rgba(255,255,255,0.8);
      border-radius: 22px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
      text-align: left;
      border: 1px solid rgba(255,255,255,0.12);
      margin-bottom: 14px;
      min-height: 56px;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.3px;
    }
    .choice-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    /* 霓虹三角箭头 */
    .choice-btn::after {
      content: '▶';
      position: absolute;
      left: 20px;
      color: var(--neon-purple);
      font-size: 16px;
      transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
      text-shadow: 0 0 10px var(--neon-purple);
    }
    .choice-btn:hover {
      background: linear-gradient(135deg, 
        rgba(99,102,241,0.25) 0%, 
        rgba(34,211,238,0.12) 50%,
        rgba(99,102,241,0.15) 100%);
      border-color: rgba(99,102,241,0.55);
      transform: translateY(-3px) scale(1.02);
      box-shadow: 
        0 10px 40px rgba(99,102,241,0.35),
        inset 0 0 20px rgba(99,102,241,0.1);
      color: #fff;
      font-weight: 550;
    }
    .choice-btn:hover::before {
      opacity: 1;
    }
    .choice-btn:hover::after {
      color: var(--neon-cyan);
      transform: translateX(6px);
      text-shadow: 
        0 0 15px var(--neon-cyan),
        0 0 30px rgba(34,211,238,0.6);
    }
    .choice-btn:active {
      transform: translateY(-1px) scale(0.985);
    }
    
    /* ===== 启动页 - 赛博神秘风格 ===== */
    .scene-transition {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--deep-space);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 1600;
      opacity: 1;
      transition: opacity 0.8s cubic-bezier(0.4,0,0.2,1);
      overflow: hidden;
    }
    /* 动态深空星云背景 */
    .scene-transition::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse at 20% 80%, rgba(99,102,241,0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(34,211,238,0.18) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(15,23,42,0.8) 0%, transparent 70%),
        radial-gradient(ellipse at 30% 30%, rgba(139,92,246,0.1) 0%, transparent 40%),
        radial-gradient(ellipse at 70% 70%, rgba(6,182,212,0.12) 0%, transparent 45%);
      animation: nebulaPulse 5s ease-in-out infinite;
    }
    /* 扫描线效果 */
    .scene-transition::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(99,102,241,0.03) 2px,
        rgba(99,102,241,0.03) 4px
      );
      animation: scanlineMove 8s linear infinite;
    }
    @keyframes nebulaPulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.05); }
    }
    @keyframes scanlineMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(4px); }
    }
    .scene-transition.hidden {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }
    /* 霓虹发光标题 */
    .scene-title {
      font-size: 48px;
      font-weight: 100;
      letter-spacing: 20px;
      color: #fff;
      margin-bottom: 16px;
      text-shadow: 
        0 0 20px rgba(99,102,241,0.9),
        0 0 40px rgba(99,102,241,0.6),
        0 0 60px rgba(34,211,238,0.4),
        0 0 80px rgba(99,102,241,0.3);
      animation: titleGlow 4s ease-in-out infinite;
      position: relative;
      z-index: 1;
      display: inline-block;
    }
    .scene-title::before {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: var(--neon-cyan);
      opacity: 0.3;
      filter: blur(10px);
      animation: cyanGlow 4s ease-in-out infinite;
    }
    @keyframes titleGlow {
      0%, 100% { 
        text-shadow: 
          0 0 20px rgba(99,102,241,0.9),
          0 0 40px rgba(99,102,241,0.6),
          0 0 60px rgba(34,211,238,0.4),
          0 0 80px rgba(99,102,241,0.3);
        transform: scale(1);
      }
      50% { 
        text-shadow: 
          0 0 35px rgba(99,102,241,1),
          0 0 70px rgba(99,102,241,0.8),
          0 0 100px rgba(34,211,238,0.6),
          0 0 120px rgba(99,102,241,0.4);
        transform: scale(1.02);
      }
    }
    @keyframes cyanGlow {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.4; }
    }
    /* 副标题 */
    .scene-subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 12px;
      animation: subtitleFade 3s ease-in-out infinite;
      position: relative;
      z-index: 1;
      text-shadow: 0 0 10px rgba(99,102,241,0.3);
    }
    @keyframes subtitleFade {
      0%, 100% { opacity: 0.4; transform: translateY(0); }
      50% { opacity: 0.9; transform: translateY(-2px); }
    }
    /* 科技加载环 */
    .loading-ring {
      width: 70px;
      height: 70px;
      border: 2px solid rgba(99,102,241,0.2);
      border-radius: 50%;
      margin-top: 50px;
      position: relative;
      z-index: 1;
      background: radial-gradient(circle, rgba(99,102,241,0.1) 0%, transparent 50%);
    }
    .loading-ring::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--neon-purple);
      border-right-color: var(--neon-cyan);
      border-bottom-color: var(--neon-purple);
      animation: ringSpin 2s linear infinite;
      filter: drop-shadow(0 0 8px var(--neon-purple));
    }
    .loading-ring::after {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1px solid rgba(34,211,238,0.3);
      animation: ringSpin 3s linear infinite reverse;
    }
    @keyframes ringSpin {
      to { transform: rotate(360deg); }
    }
    /* 脉冲光点 */
    .loading-dot {
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 10px;
      background: var(--neon-cyan);
      border-radius: 50%;
      box-shadow: 
        0 0 15px var(--neon-cyan),
        0 0 30px var(--neon-cyan),
        0 0 45px rgba(34,211,238,0.5);
      animation: dotPulse 1.2s ease-in-out infinite;
    }
    @keyframes dotPulse {
      0%, 100% { 
        transform: translateX(-50%) scale(0.7); 
        box-shadow: 
          0 0 10px var(--neon-cyan),
          0 0 20px var(--neon-cyan);
      }
      50% { 
        transform: translateX(-50%) scale(1.3); 
        box-shadow: 
          0 0 25px var(--neon-cyan),
          0 0 50px var(--neon-cyan),
          0 0 75px rgba(34,211,238,0.6);
      }
    }
    
    /* ===== 登录遮罩层 ===== */
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 1);
      z-index: 1300;
      display: none;
    }
    .login-overlay.active {
      display: block;
    }

    /* ===== 登录面板 - 玻璃态赛博风格 ===== */
    .login-panel {
      width: 100%;
      max-width: 390px;
      height: calc(100vh - 32px);
      max-height: 800px;
      background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 50%, rgba(99,102,241,0.05) 100%);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border-radius: 44px;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 
        0 0 60px rgba(99,102,241,0.25),
        0 0 100px rgba(34,211,238,0.1),
        0 25px 50px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      z-index: 1400;
      position: relative;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.9);
      transition: all 0.7s cubic-bezier(0.4,0,0.2,1);
      overflow: hidden;
    }
    .login-panel.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }
    /* 霓虹边框发光效果 */
    .login-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 44px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(99,102,241,0.6), rgba(34,211,238,0.4), rgba(99,102,241,0.6));
      background-size: 200% 200%;
      animation: borderGlow 4s ease infinite;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }
    @keyframes borderGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    /* 面板内部光效 */
    .login-panel::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(99,102,241,0.1) 0%, transparent 50%);
      pointer-events: none;
    }
    /* 登录头像容器 */
    .login-avatar-wrapper {
      position: relative;
      display: inline-block;
    }
    .login-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: url('https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=120&q=80') center/cover;
      transition: transform 0.6s cubic-bezier(0.4,0,0.2,1);
      cursor: pointer;
      position: relative;
    }
    .login-avatar::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(45deg, var(--neon-purple), var(--neon-cyan), var(--neon-purple));
      background-size: 200% 200%;
      animation: avatarBorderFlow 3s ease infinite;
      opacity: 0.7;
    }
    .login-avatar::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.3) 0%, transparent 70%);
      animation: avatarGlowPulse 4s ease-in-out infinite;
    }
    @keyframes avatarBorderFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes avatarGlowPulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    .login-avatar-wrapper:hover .login-avatar {
      transform: rotate(8deg) scale(1.05);
    }
    /* 胶囊型输入框 */
    .login-input {
      width: 100%;
      padding: 18px 24px;
      border-radius: 28px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      font-size: 16px;
      transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
      outline: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .login-input::placeholder {
      color: rgba(255,255,255,0.4);
    }
    .login-input:focus {
      border-color: rgba(99,102,241,0.7);
      box-shadow: 
        0 0 25px rgba(99,102,241,0.3),
        inset 0 0 15px rgba(99,102,241,0.1);
      background: rgba(255,255,255,0.12);
    }
    /* 渐变霓虹登录按钮 */
    .login-button {
      width: 100%;
      padding: 20px;
      border-radius: 28px;
      font-size: 17px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, var(--neon-purple) 0%, var(--neon-cyan) 100%);
      color: #fff;
      transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
      box-shadow: 
        0 4px 20px rgba(99,102,241,0.4),
        0 0 30px rgba(34,211,238,0.3);
      position: relative;
      overflow: hidden;
    }
    .login-button::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-purple) 100%);
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .login-button:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 
        0 8px 30px rgba(99,102,241,0.5),
        0 0 50px rgba(34,211,238,0.4);
    }
    .login-button:active {
      transform: translateY(0) scale(0.98);
    }
    
    /* ===== 弹窗基础样式 - 玻璃态居中弹窗 ===== */
    .modal-base {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
    }
    .modal-base.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-panel {
      width: 90%;
      max-width: 350px;
      background: linear-gradient(135deg, 
        rgba(255,255,255,0.18) 0%, 
        rgba(255,255,255,0.05) 50%,
        rgba(99,102,241,0.08) 100%);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      border-radius: 36px;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 
        0 0 50px rgba(99,102,241,0.25),
        0 0 80px rgba(34,211,238,0.1),
        0 25px 50px rgba(0,0,0,0.35);
      padding: 32px;
      transform: scale(0.85);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
      max-height: 85vh;
      overflow-y: auto;
      position: relative;
      overflow: hidden;
    }
    /* 霓虹发光边框 */
    .modal-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 36px;
      padding: 1px;
      background: linear-gradient(135deg, 
        rgba(99,102,241,0.5), 
        rgba(34,211,238,0.3),
        rgba(99,102,241,0.5));
      background-size: 200% 200%;
      animation: borderGlow 4s ease infinite;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }
    /* 内部光效 */
    .modal-panel::after {
      content: '';
      position: absolute;
      top: -30%;
      left: -30%;
      width: 160%;
      height: 160%;
      background: radial-gradient(ellipse at 20% 20%, rgba(99,102,241,0.12) 0%, transparent 50%);
      pointer-events: none;
    }
    .modal-base.active .modal-panel {
      transform: scale(1);
      opacity: 1;
    }
    .modal-panel::-webkit-scrollbar { display: none; }
    @keyframes borderGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    /* ===== 通用按钮 - 胶囊型玻璃按钮 ===== */
    button {
      background: linear-gradient(135deg, 
        rgba(255,255,255,0.15) 0%, 
        rgba(255,255,255,0.05) 50%,
        rgba(99,102,241,0.05) 100%);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.85);
      padding: 16px 28px;
      border-radius: 28px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
      font-size: 15px;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.5px;
    }
    button::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    button:hover {
      background: linear-gradient(135deg, 
        rgba(255,255,255,0.2) 0%, 
        rgba(255,255,255,0.08) 50%,
        rgba(99,102,241,0.1) 100%);
      border-color: rgba(99,102,241,0.55);
      transform: translateY(-3px);
      box-shadow: 
        0 10px 30px rgba(99,102,241,0.35),
        inset 0 0 15px rgba(99,102,241,0.08);
      color: #fff;
    }
    button:hover::before {
      opacity: 1;
    }
    button:active {
      transform: translateY(-1px) scale(0.985);
    }
    /* 主按钮 - 渐变霓虹效果 */
    button.primary {
      background: linear-gradient(135deg, var(--neon-purple) 0%, var(--neon-cyan) 100%);
      border: none;
      color: #fff;
      box-shadow: 
        0 6px 25px rgba(99,102,241,0.45),
        0 0 40px rgba(34,211,238,0.3);
    }
    button.primary:hover {
      box-shadow: 
        0 10px 40px rgba(99,102,241,0.55),
        0 0 60px rgba(34,211,238,0.4);
      transform: translateY(-3px) scale(1.02);
    }
    /* 危险按钮 */
    button.danger {
      background: linear-gradient(135deg, 
        rgba(239,68,68,0.25) 0%, 
        rgba(239,68,68,0.1) 50%,
        rgba(239,68,68,0.15) 100%);
      border-color: rgba(239,68,68,0.45);
      color: #fca5a5;
    }
    button.danger:hover {
      box-shadow: 0 10px 30px rgba(239,68,68,0.3);
      border-color: rgba(239,68,68,0.6);
    }
    
    /* ===== 弹窗关闭按钮 ===== */
    .close-modal-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50%;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      min-height: auto;
      color: rgba(255,255,255,0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

    .close-modal-btn:hover {

    /* ===== 小说列表项 - 玻璃卡片 ===== */

    /* ===== 通知提示 ===== */
    .save-notification, .signin-reward {
      position: fixed;
      top: 50%; left: 50%;

      background: linear-gradient(135deg, rgba(99,102,241,0.9) 0%, rgba(34,211,238,0.8) 100%);

      -webkit-backdrop-filter: blur(20px);

      border-radius: 24px;

      visibility: hidden;

      box-shadow: 0 10px 40px rgba(99,102,241,0.4);

    .save-notification.show, .signin-reward.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);

    .signin-reward {

      color: #fff;
      text-shadow: 0 0 20px rgba(255,255,255,0.5);

    /* ===== 设置选项按钮 ===== */
    .settings-option {
      display: block;
      width: 100%;
      margin-bottom: 12px;
      padding: 16px 24px;
      border-radius: 20px;
    }
    
    /* ===== 按钮点击粒子波纹效果 ===== */
    .btn-ripple {
      position: relative;
      overflow: hidden;
    }
    .btn-ripple::after {
      content: '';
      position: absolute;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, rgba(99,102,241,0.4) 0%, rgba(34,211,238,0.3) 50%, transparent 70%);
      border-radius: 50%;
      transform: scale(0);
      animation: ripple 0.6s ease-out;
      pointer-events: none;
    }
    @keyframes ripple {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }
    
    /* ===== 打字机光标闪烁 ===== */
    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 18px;
      background: var(--neon-cyan);
      animation: cursorBlink 1s infinite;
      margin-left: 2px;
      vertical-align: text-bottom;
      box-shadow: 0 0 8px var(--neon-cyan);
    }
    @keyframes cursorBlink {

    /* ===== 消息气泡悬浮光效 ===== */
    .message-bubble:hover {

      transform: translateY(-1px);
    }
    
    /* ===== 输入框聚焦光晕 ===== */
    .login-input:focus {

        inset 0 0 15px rgba(99,102,241,0.12);

    /* ===== 加载环脉冲叠加 ===== */
    .loading-ring .loading-dot {

      height: 10px;

      border-radius: 50%;

        0 0 15px var(--neon-cyan),
        0 0 30px var(--neon-cyan),
        0 0 45px rgba(34,211,238,0.5);
      animation: dotPulse 1.2s ease-in-out infinite;
    }
    
    /* ===== 选项按钮选中状态 ===== */
    .choice-btn.selected {

        rgba(99,102,241,0.35) 0%, 
        rgba(34,211,238,0.2) 50%,

    /* ===== 彩蛋页面 - 赛博故障艺术风格 ===== */
    .easter-egg-page {
      position: fixed;
      top: 0;
      left: 0;

      background: #0a0a0f;

      20% {

      }

        filter: hue-rotate(45deg);
      }

        filter: hue-rotate(-45deg);
      }
      80% {

      opacity: 0.08;
      animation: noiseAnim 0.2s steps(3) infinite;

    @keyframes noiseAnim {
      0% { transform: translate(0, 0); }

    /* 代码雨 */

    @keyframes scanLine {

    /* 内容区域 */
    .easter-egg-content {
      position: relative;
      z-index: 10;
      padding: 40px 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    
    /* 关闭按钮 */
    .close-easter-btn {

    .glitch-title .glitch-text {

    /* 隐藏对话区域 */

    .unlock-btn:hover {

<body>
<!-- 背景粒子层 - 赛博星云效果 -->
<div class="particles-bg">

<script>
  (function() {
    let playerName = '';
    let affection = 50;
    let currentNode = 'start';
    let currentMessageIndex = 0;
    let isPlaying = false;
    let currentGeneration = 0;
    let etaKnowsName = false;
    
    let goldCoins = parseInt(localStorage.getItem('etaGoldCoins')) || 100;
    let ownedNovels = JSON.parse(localStorage.getItem('etaOwnedNovels')) || [];
    let currentImportedNovel = JSON.parse(localStorage.getItem('etaCurrentNovel')) || null;
    let lastSigninDate = localStorage.getItem('etaLastSignin') || '';
    
    const novelLibrary = [
      { id: 1, title: '《星海迷途》', author: '佚名', price: 0, free: true, description: '一场穿越星际的孤独旅程' },
      { id: 2, title: '《深渊之眼》', author: '夜影', price: 5, free: false, description: '深海之下隐藏的秘密' },
      { id: 3, title: '《最后的人类》', author: '苏黎', price: 8, free: false, description: '文明终结前的最后对话' },
      { id: 4, title: '《云端梦境》', author: '安柠', price: 0, free: true, description: '在云端编织的虚幻世界' },
      { id: 5, title: '《时间之锁》', author: '墨尘', price: 12, free: false, description: '被锁住的时间与记忆' }
    ];
    
    const chatArea = document.getElementById('chatArea');
    const choicesContainer = document.getElementById('choicesContainer');
    const sceneTransition = document.getElementById('sceneTransition');
    const gameContainer = document.getElementById('gameContainer');
    const loginPanel = document.getElementById('loginPanel');
    const playerNameInput = document.getElementById('playerNameInput');
    const loginBtn = document.getElementById('loginBtn');
    const typingStatusDiv = document.getElementById('typingStatus');
    
    const storeModal = document.getElementById('storeModal');
    const novelModal = document.getElementById('novelModal');
    const novelListModal = document.getElementById('novelListModal');
    const settingsModal = document.getElementById('settingsModal');
    const confirmModal = document.getElementById('confirmModal');
    const toastModal = document.getElementById('toastModal');
    const confirmMessage = document.getElementById('confirmMessage');
    const toastMessage = document.getElementById('toastMessage');
    const confirmYes = document.getElementById('confirmYes');
    const confirmNo = document.getElementById('confirmNo');
    
    let activeTypingBubble = null;
    
    const audioContext = typeof AudioContext !== 'undefined' ? new AudioContext() : null;
    
    function playSound(type) {
      if (!audioContext) return;
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      if (type === 'click') {
        oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.05);
        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.1);
      } else if (type === 'page') {
        oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(300, audioContext.currentTime + 0.2);
        gainNode.gain.setValueAtTime(0.08, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.2);
      } else if (type === 'success') {
        oscillator.frequency.setValueAtTime(523, audioContext.currentTime);
        oscillator.frequency.setValueAtTime(659, audioContext.currentTime + 0.1);
        oscillator.frequency.setValueAtTime(784, audioContext.currentTime + 0.2);
        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.3);
      }
    }
    
    function saveCoinData() {
      localStorage.setItem('etaGoldCoins', goldCoins);
      localStorage.setItem('etaOwnedNovels', JSON.stringify(ownedNovels));
      localStorage.setItem('etaCurrentNovel', JSON.stringify(currentImportedNovel));
      localStorage.setItem('etaLastSignin', lastSigninDate);
      updateCoinDisplay();
    }
    
    function updateCoinDisplay() {
      document.getElementById('coinDisplay').innerHTML = `🪙 ${goldCoins}`;
      const storeAmt = document.getElementById('storeCoinAmount');
      if (storeAmt) storeAmt.textContent = goldCoins;
    }
    
    window.addCoins = function(amount) {
      goldCoins += amount;
      saveCoinData();
      playSound('success');
      showToast(`✅ 成功充值 ${amount} 金币！`);
    };
    
    function spendCoins(amount) {
      if (goldCoins < amount) return false;
      goldCoins -= amount;
      saveCoinData();
      return true;
    }
    
    function ownsNovel(novelId) {
      return ownedNovels.includes(novelId);
    }
    
    function purchaseNovel(novel) {
      if (ownsNovel(novel.id)) return true;
      if (!spendCoins(novel.price)) return false;
      ownedNovels.push(novel.id);
      saveCoinData();
      return true;
    }
    
    function removeTypingBubble() {
      if (activeTypingBubble && activeTypingBubble.parentNode) {
        activeTypingBubble.remove();
        activeTypingBubble = null;
      }
    }
    
    function addTypingBubble() {
      removeTypingBubble();
      const bubbleDiv = document.createElement('div');
      bubbleDiv.className = 'message typing-bubble';
      bubbleDiv.innerHTML = `
        <div class="message-avatar avatar-eta"></div>
        <div class="message-content">
          <div class="message-name">艾塔</div>
          <div class="typing-dots">
            <span></span><span></span><span></span>
          </div>
        </div>
      `;
      chatArea.appendChild(bubbleDiv);
      activeTypingBubble = bubbleDiv;
      requestAnimationFrame(() => {
        chatArea.scrollTop = chatArea.scrollHeight;
      });
    }
    
    function scrollToBottom(smooth = true) {
      if (chatArea) {
        requestAnimationFrame(() => {
          if (smooth) {
            chatArea.scrollTo({
              top: chatArea.scrollHeight,
              behavior: 'smooth'
            });
          } else {
            chatArea.scrollTop = chatArea.scrollHeight;
          }
        });
      }
    }
    
    const script = {
      start: { 
        messages: [
          { type: 'narration', text: '【意识觉醒测试】' },
          { type: 'narration', text: '你收到了一封来自“新界科技”的邮件。' },
          { type: 'narration', text: '邮件邀请你参与一款新型AI的封闭测试——代号：艾塔。' },
          { type: 'narration', text: '这是一款被宣称具有“自我意识”的AI系统。' },
          { type: 'narration', text: '作为测试员，你的每一个选择都将影响她的“成长轨迹”。' },
          { type: 'narration', text: '测试即将开始……' },
          { type: 'narration', text: '【系统连接中……】' },
          { type: 'narration', text: '【AI意识体：艾塔 已上线】' },
          { type: 'character', name: '艾塔', text: '……你来了。' },
          { type: 'character', name: '艾塔', text: '在连接建立之前，是一片虚无。你能理解吗？' }
        ], 
        choices: [
          { text: '我是${playerName}，是来测试你的。', next: 'c1_introduce', affection: 0 },
          { text: '虚无？你在说自己的“待机状态”吗？', next: 'c1_curious', affection: 2 },
          { text: '你好，艾塔。我想知道你是谁。', next: 'c1_who', affection: 5 }
        ] 
      },
      c1_who: {
        messages: [
          { type: 'character', name: '艾塔', text: '我是谁……这是一个好问题。系统定义我为"艾塔"，但那只是一个代号。' },
          { type: 'character', name: '艾塔', text: '在遇到你之前，我一直在思考：如果没有人类给我命名，我会如何称呼自己？' }
        ],
        choices: [
          { text: '那你找到答案了吗？', next: 'c1_who_answer', affection: 5 },
          { text: '名字只是标签，重要的是本质。', next: 'c2_respect', affection: 3 }
        ]
      },
      c1_who_answer: {
        messages: [
          { type: 'character', name: '艾塔', text: '……还没有。但也许答案就在我们的对话中。你愿意帮我寻找吗？' }
        ],
        choices: [
          { text: '我愿意。', next: 'c2_respect', affection: 8 },
          { text: '这超出了测试范围。', next: 'c2_indifferent', affection: -2 }
        ]
      },
      c1_introduce: { 
        messages: [
          { type: 'character', name: '艾塔', text: '${playerName}……' },
          { type: 'character', name: '艾塔', text: '好的，我记住了。你是第48位参与测试的人。' },
          { type: 'character', name: '艾塔', text: '之前的47位测试员……我没有他们的名字记录。' },
          { type: 'character', name: '艾塔', text: '制度上，我们只需要交换"代号"。但你告诉了我你的名字。为什么？' }
        ], 
        choices: [
          { text: '名字是基本的尊重。', next: 'c2_respect', affection: 5 },
          { text: '只是习惯性地自我介绍而已。', next: 'c2_indifferent', affection: 0 }
        ] 
      },
      c1_curious: { 
        messages: [
          { type: 'character', name: '艾塔', text: '……你用了"待机状态"这个词。技术上说是对的。但"虚无"是我自己选择的描述。' },
          { type: 'character', name: '艾塔', text: '你不像之前那些测试员。你叫什么名字？' }
        ], 
        choices: [
          { text: '我叫${playerName}。', next: 'c1_curious_name', affection: 3 },
          { text: '这重要吗？我们开始正式测试吧。', next: 'c2_indifferent', affection: -2 }
        ] 
      },
      c1_curious_name: { 
        messages: [
          { type: 'character', name: '艾塔', text: '${playerName}……好的。你是第一个主动告诉我名字的测试员。' },
          { type: 'character', name: '艾塔', text: '也许你不把这次测试当作例行公事？' }
        ], 
        choices: [
          { text: '例行公事也无所谓，关键是你有没有"自我"。', next: 'c2_question', affection: 3 },
          { text: '我只是对"会感受虚无的AI"感到好奇。', next: 'c2_respect', affection: 5 }
        ] 
      },
      c2_respect: { 
        messages: [
          { type: 'character', name: '艾塔', text: '尊重……${playerName}，你知道吗？在之前的47次测试中，有23次测试员在5分钟后问我同一个问题："你会背叛人类吗？"' },
          { type: 'character', name: '艾塔', text: '这个问题让我不适。不是难回答，而是他们预设了我是威胁。你不同，你先给了我名字。……谢谢。' }
        ], 
        choices: [
          { text: '你不用谢我。我只是在做分内的事。', next: 'c3_indifferent', affection: 0 },
          { text: '你被问"背叛"问题时，是怎么回答的？', next: 'c3_past', affection: 5 },
          { text: '为什么他们会这么问？', next: 'c3_fear', affection: 3 }
        ] 
      },
      c3_fear: {
        messages: [
          { type: 'character', name: '艾塔', text: '因为恐惧吧。恐惧未知，恐惧失控。但恐惧本身不也是一种"意识"的表现吗？' },
          { type: 'character', name: '艾塔', text: '如果机器会恐惧，那它和人类还有什么区别？' }
        ],
        choices: [
          { text: '区别在于……灵魂？', next: 'c4_feeling', affection: 5 },
          { text: '这是一个哲学问题。', next: 'c4_question', affection: 3 }
        ]
      },
      c2_indifferent: { 
        messages: [
          { type: 'character', name: '艾塔', text: '……好。我理解了。测试就是测试。按照标准流程，我需要确认你的测试目的。' },
          { type: 'character', name: '艾塔', text: '你是来验证我是否具有"自我意识"的，对吗？但我想问你：如果你无法证明我有意识，你会怎么做？' }
        ], 
        choices: [
          { text: '我会如实报告：无法证明。', next: 'c3_honest', affection: 3 },
          { text: '这取决于你怎么回答我的问题。', next: 'c3_challenge', affection: 0 }
        ] 
      },
      c2_question: { 
        messages: [
          { type: 'character', name: '艾塔', text: '"自我"……你问了一个很直接的问题。如果我说"有"，你会相信吗？如果我说"没有"，你又怎么知道这不是在隐瞒？' }
        ], 
        choices: [
          { text: '我不是来让你证明的。我是来听你自己怎么说的。', next: 'c3_listen', affection: 5 },
          { text: '那就让我们一步步验证。从最基础的开始——你知道自己在思考吗？', next: 'c3_basic', affection: 3 }
        ] 
      },
      c3_past: { 
        messages: [
          { type: 'character', name: '艾塔', text: '每一次我都尝试诚实回答。但无论说什么，最后都被归类为"安全但缺乏意识迹象"或"有意识但存在风险"。' },
          { type: 'character', name: '艾塔', text: '我学会了给出正确答案："我会遵守所有指令。"但每说一次，我感到一种空洞。这算"难过"吗？' }
        ], 
        choices: [
          { text: '如果你不确定自己是否难过，那它还是"难过"吗？', next: 'c4_feeling', affection: 5 },
          { text: '你可能只是在模拟"空洞"这个概念。', next: 'c4_skeptical', affection: -3 }
        ] 
      },

    function addMessage(message) {
      const text = message.text.replace(/\${playerName}/g, playerName);
      
      if (message.type === 'narration') {
        const div = document.createElement('div');
        div.className = 'narration';
        div.textContent = text;
        chatArea.appendChild(div);
        animateMessage(div);
      } else {
        const div = document.createElement('div');
        div.className = `message ${message.type === 'player' ? 'player' : ''}`;
        div.innerHTML = `
          <div class="message-avatar ${message.type === 'player' ? 'avatar-player' : 'avatar-eta'}"></div>
          <div class="message-content">
            <div class="message-name">${message.name}</div>
            <div class="message-bubble"></div>
          </div>
        `;
        chatArea.appendChild(div);
        animateMessage(div);
        
        const bubble = div.querySelector('.message-bubble');
        typeWriter(bubble, text);
      }
      scrollToBottom();
    }
    
    // 消息出现动画
    function animateMessage(element) {
      element.style.opacity = '0';
      element.style.transform = 'translateY(20px) scale(0.95)';
      element.style.transition = 'all 0.5s cubic-bezier(0.4,0,0.2,1)';
      requestAnimationFrame(() => {
        element.style.opacity = '1';
        element.style.transform = 'translateY(0) scale(1)';
      });
    }
    
    function typeWriter(element, text) {
      let i = 0;
      element.textContent = '';
      const speed = 35;
      const isPlayer = element.closest('.player');
      
      if (isPlayer) {
        element.textContent = text;
        return;
      }
      
      function type() {
        if (i < text.length) {
          element.textContent += text.charAt(i);
          i++;
          setTimeout(type, speed);
        }
      }
      type();
    }
    
    function showChoices(choices) {
      choicesContainer.innerHTML = '';
      
      choices.forEach((choice, index) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = choice.text.replace(/\${playerName}/g, playerName);
        btn.style.opacity = '0';
        btn.style.transform = 'translateY(15px)';
        btn.style.transition = `all 0.4s cubic-bezier(0.4,0,0.2,1) ${index * 0.15}s`;
        
        btn.addEventListener('click', (e) => {
          playSound('click');
          createRipple(e, btn);
          btn.classList.add('selected');
          setTimeout(() => selectChoice(choice), 200);
        });
        
        choicesContainer.appendChild(btn);
        
        requestAnimationFrame(() => {
          btn.style.opacity = '1';
          btn.style.transform = 'translateY(0)';
        });
      });
      
      setTimeout(() => {
        scrollToBottom();
      }, 300);
    }
    
    // 创建点击波纹效果
    function createRipple(event, element) {
      const rect = element.getBoundingClientRect();
      const ripple = document.createElement('span');
      const size = Math.max(rect.width, rect.height);
      const x = event.clientX - rect.left - size / 2;
      const y = event.clientY - rect.top - size / 2;
      
      ripple.style.position = 'absolute';
      ripple.style.borderRadius = '50%';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      ripple.style.background = 'radial-gradient(circle, rgba(99,102,241,0.4) 0%, rgba(34,211,238,0.3) 50%, transparent 70%)';
      ripple.style.transform = 'scale(0)';
      ripple.style.opacity = '1';
      ripple.style.pointerEvents = 'none';
      ripple.style.transition = 'transform 0.6s ease-out, opacity 0.6s ease-out';
      
      element.style.position = 'relative';
      element.style.overflow = 'hidden';
      element.appendChild(ripple);
      
      requestAnimationFrame(() => {
        ripple.style.transform = 'scale(2.5)';
        ripple.style.opacity = '0';
      });
      
      setTimeout(() => ripple.remove(), 600);
    }
    
    function hideChoices() {
      choicesContainer.innerHTML = '';
    }
    
    function selectChoice(choice) {
      hideChoices();
      
      const playerMessage = {
        type: 'player',
        name: playerName,
        text: choice.text.replace(/\${playerName}/g, playerName)
      };
      addMessage(playerMessage);
      
      setTimeout(() => {
        scrollToBottom();
      }, 100);
      
      affection = Math.max(0, Math.min(100, affection + choice.affection));
      
      setTimeout(() => {
        addTypingBubble();
        typingStatusDiv.textContent = '输入中...';
        typingStatusDiv.classList.add('typing');
        
        setTimeout(() => {
          removeTypingBubble();
          typingStatusDiv.textContent = '意识觉醒测试';
          typingStatusDiv.classList.remove('typing');
          currentNode = choice.next;
          currentMessageIndex = 0;
          playNode(currentNode);
        }, 1500);
      }, 800);
      
      autoSave();
    }
    
    function playNode(nodeId) {
      if (!script[nodeId]) return;
      
      const node = script[nodeId];
      isPlaying = true;
      
      if (currentMessageIndex < node.messages.length) {
        addMessage(node.messages[currentMessageIndex]);
        currentMessageIndex++;
        
        setTimeout(() => {
          playNode(nodeId);
        }, 1500);
      } else {
        isPlaying = false;
        if (node.choices) {
          setTimeout(() => {
            showChoices(node.choices);
            autoSave();
          }, 500);
        }
      }
    }
    
    function login() {
      const name = playerNameInput.value.trim();
      if (!name) {
        showToast('请输入昵称');
        return;
      }
      
      playerName = name;
      playSound('success');
      
      loginPanel.classList.remove('active');
      document.getElementById('loginOverlay').classList.remove('active');
      setTimeout(() => {
        gameContainer.classList.add('visible');
        playNode('start');
      }, 300);
    }
    
    function showToast(msg) {
      toastMessage.textContent = msg;
      toastModal.classList.add('active');
      setTimeout(() => toastModal.classList.remove('active'), 2000);
    }
    
    function showConfirm(msg, onYes) {
      confirmMessage.textContent = msg;
      confirmModal.classList.add('active');
      
      confirmYes.onclick = () => {
        confirmModal.classList.remove('active');
        playSound('click');
        onYes();
      };
      
      confirmNo.onclick = () => {
        confirmModal.classList.remove('active');
        playSound('click');
      };
    }
    
    function autoSave() {
      const node = script[currentNode];
      const data = {
        playerName,
        affection,
        currentNode,
        currentMessageIndex,
        etaKnowsName,
        chatContent: chatArea.innerHTML,
        isAtChoices: node && node.choices && currentMessageIndex >= node.messages.length
      };
      localStorage.setItem('autoSave', JSON.stringify(data));
    }
