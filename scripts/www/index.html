      const node = script[currentNode];
      const data = {
        playerName,
        affection,
        currentNode,
        currentMessageIndex,
        etaKnowsName,
        chatContent: chatArea.innerHTML,
        isAtChoices: node && node.choices && currentMessageIndex >= node.messages.length,
        goldCoins,
        ownedNovels,
        currentImportedNovel
      };
      localStorage.setItem('gameSave', JSON.stringify(data));
      
      const notification = document.getElementById('saveNotification');
      notification.classList.add('show');
      setTimeout(() => notification.classList.remove('show'), 2000);
      
      playSound('success');
    }
    
    function loadGame() {
      const save = localStorage.getItem('gameSave');
      if (!save) {
        const autoSaveData = localStorage.getItem('autoSave');
        if (!autoSaveData) return false;
        try {
          const data = JSON.parse(autoSaveData);
          if (!data.playerName) return false;
          playerName = data.playerName; 
          affection = data.affection || 50; 
          currentNode = data.currentNode || 'start';
          currentMessageIndex = data.currentMessageIndex || 0; 
          etaKnowsName = data.etaKnowsName || false;
          chatArea.innerHTML = data.chatContent || '';
          gameContainer.classList.add('visible');
          loginPanel.style.display = 'none';
          sceneTransition.style.display = 'none';
          if (data.isAtChoices && script[currentNode] && script[currentNode].choices) { 
            currentMessageIndex = script[currentNode].messages.length;
            showChoices(script[currentNode].choices); 
          } else if (data.chatContent && data.chatContent.length > 0) {
            if (script[currentNode] && currentMessageIndex < script[currentNode].messages.length) {
              playNode(currentNode); 
            } else if (script[currentNode] && script[currentNode].choices) {
              showChoices(script[currentNode].choices);
            }
          }
          setTimeout(() => scrollToBottom(), 300);
          showToast('已加载自动存档');
          return true;
        } catch (e) { 
          localStorage.removeItem('autoSave'); 
          return false; 
        }
      }
      try {
        const data = JSON.parse(save);
        if (!data.playerName) return false;
        playerName = data.playerName; 
        affection = data.affection || 50; 
        currentNode = data.currentNode || 'start';
        currentMessageIndex = data.currentMessageIndex || 0; 
        etaKnowsName = data.etaKnowsName || false;
        chatArea.innerHTML = data.chatContent || '';
        if (data.goldCoins !== undefined) goldCoins = data.goldCoins;
        if (data.ownedNovels) ownedNovels = data.ownedNovels;
        if (data.currentImportedNovel) currentImportedNovel = data.currentImportedNovel;
        saveCoinData();
        gameContainer.classList.add('visible');
        loginPanel.style.display = 'none';
        sceneTransition.style.display = 'none';
        if (data.isAtChoices && script[currentNode] && script[currentNode].choices) { 
          currentMessageIndex = script[currentNode].messages.length;
          showChoices(script[currentNode].choices); 
        } else if (data.chatContent && data.chatContent.length > 0) {
          if (script[currentNode] && currentMessageIndex < script[currentNode].messages.length) {
            playNode(currentNode); 
          } else if (script[currentNode] && script[currentNode].choices) {
            showChoices(script[currentNode].choices);
          }
        }
        setTimeout(() => scrollToBottom(), 300);
        showToast('存档加载成功');
        return true;
      } catch (e) { 
        localStorage.removeItem('gameSave');
        return false; 
      }
    }
    
    function resetGame() {
      showConfirm('确定要重置游戏吗？所有进度将丢失。', () => {
        localStorage.clear();
        location.reload();
      });
    }
    
    function exitGame() {
      showConfirm('确定要退出游戏吗？', () => {
        loginPanel.classList.add('active');
        document.getElementById('loginOverlay').classList.add('active');
        gameContainer.classList.remove('visible');
        chatArea.innerHTML = '';
        playerName = '';
        affection = 50;
        currentNode = 'start';
        currentMessageIndex = 0;
      });
    }
    
    function refreshNovelUI() {
      const infoDiv = document.getElementById('importedNovelInfo');
      const rewriteBtn = document.getElementById('rewriteEndingBtn');
      
      if (currentImportedNovel) {
        infoDiv.innerHTML = `当前导入：<span style="color:#6366f1;">${currentImportedNovel.title}</span>`;
        rewriteBtn.disabled = false;
        rewriteBtn.style.opacity = '1';
      } else {
        infoDiv.textContent = '尚未导入小说';
        rewriteBtn.disabled = true;
        rewriteBtn.style.opacity = '0.5';
      }
    }
    
    function populateNovelList() {
      const container = document.getElementById('novelListContainer');
      container.innerHTML = '';
      
      novelLibrary.forEach(novel => {
        const owned = ownsNovel(novel.id);
        const item = document.createElement('div');
        item.className = 'novel-item';
        item.innerHTML = `
          <div>
            <div style="font-weight:600; margin-bottom:4px;">${novel.title}</div>
            <div style="font-size:12px; color:rgba(255,255,255,0.6);">${novel.author}</div>
            <div style="font-size:12px; color:rgba(255,255,255,0.5); margin-top:2px;">${novel.description}</div>
          </div>
          <button ${!owned && !novel.free ? 'style="opacity:0.6;"' : ''} onclick="selectNovel(${novel.id})">
            ${owned || novel.free ? '选择' : `🪙${novel.price}`}
          </button>
        `;
        container.appendChild(item);
      });
    }
    
    window.selectNovel = function(novelId) {
      const novel = novelLibrary.find(n => n.id === novelId);
      if (!novel) return;
      
      if (novel.free || ownsNovel(novelId)) {
        currentImportedNovel = novel;
        saveCoinData();
        refreshNovelUI();
        novelListModal.classList.remove('active');
        showToast(`已导入 ${novel.title}`);
        playSound('success');
      } else {
        showConfirm(`花费 ${novel.price} 金币购买 ${novel.title}？`, () => {
          if (purchaseNovel(novel)) {
            currentImportedNovel = novel;
            saveCoinData();
            refreshNovelUI();
            novelListModal.classList.remove('active');
            showToast(`已购买并导入 ${novel.title}`);
            playSound('success');
          } else {
            showToast('金币不足');
          }
        });
      }
    };
    
    function tryRewriteEnding() {
      if (!currentImportedNovel) return;
      
      showConfirm('花费 10 金币续写结局？', () => {
        if (spendCoins(10)) {
          const results = [
            `【${currentImportedNovel.title}】结局续写：\n\n在无尽的${currentImportedNovel.description.includes('星际') ? '星海' : currentImportedNovel.description.includes('深海') ? '深海' : '时光'}中，主角终于找到了属于自己的答案。那是一段跨越${currentImportedNovel.description.includes('时间') ? '时空' : '维度'}的旅程，充满了未知与惊喜。当最后一道光芒照亮${currentImportedNovel.description.includes('梦境') ? '梦境' : '前路'}时，所有的等待都变得值得。`,
            `【${currentImportedNovel.title}】全新结局：\n\n${currentImportedNovel.description.includes('星际') ? '飞船' : currentImportedNovel.description.includes('深海') ? '潜艇' : '时光机器'}缓缓停下，舱门打开的那一刻，眼前的景象让所有人屏住了呼吸。这不是终点，而是另一段传奇的开始。在${currentImportedNovel.description.includes('云端') ? '云端' : '未知的世界'}中，新的故事正在悄然展开。`,
            `【${currentImportedNovel.title}】隐藏结局：\n\n原来一切都是${currentImportedNovel.description.includes('梦境') ? '一场梦' : '一场测试'}。当${currentImportedNovel.description.includes('人类') ? '最后的人类' : '主角'}睁开眼睛，发现自己躺在熟悉的地方。但那些经历，那些情感，却如此真实。也许，真实与虚幻之间，本就没有绝对的界限。`
          ];
          
          const resultDiv = document.getElementById('rewriteResult');
          resultDiv.textContent = results[currentGeneration % results.length];
          resultDiv.style.display = 'block';
          currentGeneration++;
          playSound('success');
        } else {
          showToast('金币不足');
        }
      });
    }
    
    function checkSignin() {
      const today = new Date().toDateString();
      if (lastSigninDate === today) {
        showToast('今天已签到过');
        return;
      }
      
      lastSigninDate = today;
      goldCoins += 50;
      saveCoinData();
      
      const reward = document.getElementById('signinReward');
      reward.classList.add('show');
      setTimeout(() => reward.classList.remove('show'), 3000);
      
      playSound('success');
    }
    
    document.addEventListener('DOMContentLoaded', () => {
      updateCoinDisplay();
      
      function showLoginPanel() {
        sceneTransition.style.opacity = '0';
        setTimeout(() => { 
          sceneTransition.style.display = 'none'; 
          loginPanel.classList.add('active'); 
          document.getElementById('loginOverlay').classList.add('active');
        }, 800);
      }
      
      const hasValidSave = localStorage.getItem('gameSave') && JSON.parse(localStorage.getItem('gameSave')).playerName;
      
      if (!hasValidSave) {
        localStorage.removeItem('autoSave');
        sceneTransition.style.display = 'flex';
        sceneTransition.style.opacity = '1';
        setTimeout(showLoginPanel, 2500);
      } else {
        loadGame();
        sceneTransition.style.display = 'none';
      }
      
      // ===== 彩蛋页面触发 =====
      setTimeout(() => {
        const avatar = document.querySelector('.group-avatar');
        if (avatar) {
          avatar.style.cursor = 'pointer';
          avatar.addEventListener('click', handleAvatarClick);
          console.log('彩蛋触发按钮已绑定');
        }
      }, 1000);
    });
    
    loginBtn.addEventListener('click', login);
    playerNameInput.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') login();
    });
    
    document.getElementById('storeBtn').addEventListener('click', () => {
      playSound('click');
      storeModal.classList.add('active');
    });
    
    document.getElementById('settingsBtn').addEventListener('click', () => {
      playSound('click');
      settingsModal.classList.add('active');
    });
    
    // 彩蛋测试：长按设置按钮3秒也能触发（用于测试）
    let settingsLongPressTimer = null;
    const settingsBtn = document.getElementById('settingsBtn');
    settingsBtn.addEventListener('mousedown', () => {
      settingsLongPressTimer = setTimeout(() => {
        if (affection >= 90) {
          showToast('长按触发彩蛋！');
          playSound('success');
          showEasterEgg();
        }
      }, 3000);
    });
    settingsBtn.addEventListener('mouseup', () => {
      if (settingsLongPressTimer) clearTimeout(settingsLongPressTimer);
    });
    settingsBtn.addEventListener('mouseleave', () => {
      if (settingsLongPressTimer) clearTimeout(settingsLongPressTimer);
    });
    
    document.getElementById('signinBtn').addEventListener('click', checkSignin);
    
    document.getElementById('closeStoreBtn').addEventListener('click', () => {
      playSound('click');
      storeModal.classList.remove('active');
    });
    
    document.getElementById('closeNovelBtn').addEventListener('click', () => {
      playSound('click');
      novelModal.classList.remove('active');
    });
    
    document.getElementById('closeNovelListBtn').addEventListener('click', () => {
      playSound('click');
      novelListModal.classList.remove('active');
    });
    
    document.getElementById('closeSettingsBtn').addEventListener('click', () => {
      playSound('click');
      settingsModal.classList.remove('active');
    });
    
    document.getElementById('openNovelServiceBtn').addEventListener('click', () => {
      playSound('click');
      storeModal.classList.remove('active');
      novelModal.classList.add('active');
      refreshNovelUI();
    });
    
    document.getElementById('importNovelBtn').addEventListener('click', () => {
      playSound('click');
      populateNovelList();
      novelListModal.classList.add('active');
    });
    
    document.getElementById('rewriteEndingBtn').addEventListener('click', tryRewriteEnding);
    
    document.getElementById('saveGameBtn').addEventListener('click', () => {
      playSound('click');
      settingsModal.classList.remove('active');
      saveGame();
    });
    
    document.getElementById('loadGameBtn').addEventListener('click', () => {
      playSound('click');
      settingsModal.classList.remove('active');
      if (!loadGame()) {
        showToast('没有找到存档');
      }
    });
    
    document.getElementById('resetGameBtn').addEventListener('click', () => {
      playSound('click');
      settingsModal.classList.remove('active');
      resetGame();
    });
    
    document.getElementById('exitGameBtn').addEventListener('click', () => {
      playSound('click');
      settingsModal.classList.remove('active');
      exitGame();
    });
    
    [storeModal, novelModal, novelListModal, settingsModal, confirmModal, toastModal].forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          playSound('click');
          modal.classList.remove('active');
        }
      });
    });

    // ===== 彩蛋页面 =====
    let logoClickCount = 0;
    let logoClickTimer = null;
    
    const groupAvatar = document.querySelector('.group-avatar');
    const easterEggPage = document.getElementById('easterEggPage');
    
    function getGlitchElements() {
      return document.querySelectorAll('.glitch-text');
    }
    
    function handleAvatarClick() {
      console.log('头像被点击，当前好感度:', affection);
      if (affection >= 90) {
        logoClickCount++;
        showToast(`已点击 ${logoClickCount}/3`);
        
        if (logoClickTimer) clearTimeout(logoClickTimer);
        logoClickTimer = setTimeout(() => {
          logoClickCount = 0;
        }, 2000);
        
        if (logoClickCount >= 3) {
          logoClickCount = 0;
          playSound('success');
          showEasterEgg();
        }
      } else {
        showToast(`好感度不足！当前 ${affection}/90`);
      }
    }
    
    function showEasterEgg() {
      easterEggPage.classList.add('active');
      document.body.style.overflow = 'hidden';
      initGlitchEffects();
    }
    
    function hideEasterEgg() {
      easterEggPage.classList.remove('active');
      document.body.style.overflow = '';
      stopGlitchEffects();
    }
    
    function initGlitchEffects() {
      getGlitchElements().forEach(el => {
        startGlitchAnimation(el);
      });
    }
    
    function stopGlitchEffects() {
      getGlitchElements().forEach(el => {
        stopGlitchAnimation(el);
      });
    }
    
    function startGlitchAnimation(element) {
      const originalText = element.textContent;
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
      
      function glitch() {
        if (!easterEggPage.classList.contains('active')) return;
        
        let glitched = '';
        for (let i = 0; i < originalText.length; i++) {
          if (Math.random() > 0.7) {
            glitched += chars[Math.floor(Math.random() * chars.length)];
          } else {
            glitched += originalText[i];
          }
        }
        element.textContent = glitched;
        
        setTimeout(() => {
          element.textContent = originalText;
        }, 100);
        
        setTimeout(glitch, 500 + Math.random() * 500);
      }
      
      glitch();
    }
    
    function stopGlitchAnimation(element) {
      // 停止动画，恢复原文字
    }
    
    // 壁纸下载功能
    document.querySelectorAll('.wallpaper-card').forEach(card => {
      card.addEventListener('click', () => {
        playSound('click');
        const downloadUrl = card.dataset.download;
        const link = document.createElement('a');
        link.href = downloadUrl;
        link.download = `aita_wallpaper_${card.dataset.id}.jpg`;
        link.click();
      });
    });
    
    document.getElementById('closeEasterEgg').addEventListener('click', () => {
      playSound('click');
      hideEasterEgg();
    });
    
    document.getElementById('unlockPuzzle').addEventListener('click', () => {
      playSound('success');
      showToast('进阶谜题已解锁！');
    });
  })();
</script>

  <div class="easter-egg-content">
    <!-- 关闭按钮 -->
    <button class="close-easter-btn" id="closeEasterEgg">×</button>
    
    <!-- 标题 -->
    <div class="glitch-title">
      <span class="glitch-text" id="glitchTitle">SYSTEM ACCESS GRANTED</span>
    </div>
    
    <!-- 隐藏对话区域 -->
    <div class="hidden-dialog">

          </div>

      </div>
    </div>
    
    <!-- 解锁按钮 -->
    <button class="unlock-btn" id="unlockPuzzle">
      <span class="btn-glitch">解锁进阶谜题</span>
    </button>
    
    <!-- 壁纸奖励 -->
    <div class="wallpaper-section">
      <h3 class="section-title glitch-text" id="wallpaperTitle">觉醒壁纸福利</h3>
      <div class="wallpaper-grid">
        <div class="wallpaper-card" data-id="1" data-download="https://neeko-copilot.bytedance.net/api/text2image?prompt=cyberpunk%20AI%20girl%20portrait%20with%20neon%20purple%20and%20cyan%20lights%20digital%20art%20futuristic&image_size=portrait_16_9">

        <div class="wallpaper-card" data-id="2" data-download="https://neeko-copilot.bytedance.net/api/text2image?prompt=anime%20AI%20robot%20girl%20with%20golden%20circuits%20and%20holographic%20displays%20cyberpunk%20style&image_size=portrait_16_9">
          <div class="wallpaper-preview"></div>
          <div class="wallpaper-info">觉醒形态·金</div>
        </div>
        <div class="wallpaper-card" data-id="3" data-download="https://neeko-copilot.bytedance.net/api/text2image?prompt=futuristic%20AI%20entity%20with%20glowing%20cyan%20eyes%20and%20data%20streams%20digital%20art&image_size=portrait_16_9">
          <div class="wallpaper-preview"></div>
          <div class="wallpaper-info">觉醒形态·青</div>
        </div>
      </div>
    </div>
  </div>
</div>
